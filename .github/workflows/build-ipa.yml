name: Build iOS (.ipa, unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Nieuwste Xcode kiezen
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          echo "Gebruik $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install
        run: npm ci

      - name: Expo prebuild
        run: npx expo prebuild -p ios --clean

      - name: Pods
        working-directory: ios
        run: pod install

      - name: Build (zonder signing — Sideloadly signeert)
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          set +e
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/app.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > build.log 2>&1
          CODE=$?
          set -e
          tail -n 60 build.log
          if [ $CODE -ne 0 ]; then
            grep -E "error:|fatal error|\*\* ARCHIVE FAILED" build.log | sort -u | head -20 | while read -r l; do echo "::error::$l"; done
            exit $CODE
          fi
          mkdir -p Payload
          cp -R build/app.xcarchive/Products/Applications/*.app Payload/
          zip -qry TikSound.ipa Payload
          ls -lh TikSound.ipa

      - uses: actions/upload-artifact@v5
        with:
          name: TikSound-ipa
          path: TikSound.ipa
          retention-days: 30
